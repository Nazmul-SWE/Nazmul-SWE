name: Update profile counts

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch counts from the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          USER_LOGIN: ${{ github.repository_owner }}
        run: |
          mkdir -p assets
          data=$(gh api "users/$USER_LOGIN")
          write() {
            printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"0969da"}\n' "$1" "$2" > "assets/$3.json"
          }
          write "Repositories" "$(echo "$data" | jq -r .public_repos)" repos
          write "Followers" "$(echo "$data" | jq -r .followers)" followers
          write "Following" "$(echo "$data" | jq -r .following)" following

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/repos.json assets/followers.json assets/following.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update profile counts"
            git push
          fi
